name: Manually build Home Master Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require persistent Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Create the permanent Home Master signing key once and save it as KEYSTORE_B64 and KS_PASS repository secrets. Keep this key for every future release; never rotate it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/home-master-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/home-master-signing/release.keystore"
          test -s "$RUNNER_TEMP/home-master-signing/release.keystore"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Set build version and server manifest
        env:
          VERSION: 3.1.${{ github.run_number }}
        run: |
          VERSION="3.1.${GITHUB_RUN_NUMBER}"
          CODE="$((31000 + GITHUB_RUN_NUMBER))"
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]+\"/android:versionName=\"$VERSION\"/" android/AndroidManifest.xml
          export VERSION
          python3 -c 'import json,os; json.dump({"version":os.environ["VERSION"],"name":"Home Master "+os.environ["VERSION"],"notes":"Обновление Home Master, подготовленное администратором."},open("android/latest.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)'

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE: ${{ runner.temp }}/home-master-signing/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh
          apksigner verify --verbose HomeMaster.apk
          apksigner verify --print-certs HomeMaster.apk
          sha256sum HomeMaster.apk > HomeMaster.apk.sha256
          aapt dump badging HomeMaster.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)"
          cat HomeMaster.apk.sha256

      - name: Upload APK and TrueNAS update manifest
        uses: actions/upload-artifact@v4
        with:
          name: HomeMaster-APK-${{ github.run_number }}
          path: |
            android/HomeMaster.apk
            android/latest.json
            android/HomeMaster.apk.sha256
          if-no-files-found: error
          retention-days: 30
