name: Build and publish Home Master Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Load persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add repository Actions secrets KEYSTORE_B64 and KS_PASS before building."
            exit 1
          fi
          KEY_ALIAS="${KEY_ALIAS_SECRET:-prontofix}"
          mkdir -p "$RUNNER_TEMP/home-master-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/home-master-signing/release.keystore"
          test -s "$RUNNER_TEMP/home-master-signing/release.keystore"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Validate signing keystore
        env:
          KEYSTORE: ${{ runner.temp }}/home-master-signing/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -euo pipefail
          openssl pkcs12 -in "$KEYSTORE" -passin env:KS_PASS -info -noout >/dev/null
          keytool -list -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias are readable."

      - name: Set build version
        id: meta
        run: |
          set -euo pipefail
          VERSION="3.1.${GITHUB_RUN_NUMBER}"
          CODE="$((31000 + GITHUB_RUN_NUMBER))"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName '[^']+'/versionName '$VERSION'/" android/app/build.gradle
          export VERSION
          python3 -c 'import json,os; json.dump({"version":os.environ["VERSION"],"name":"Home Master "+os.environ["VERSION"],"notes":"Обновление Home Master, опубликованное через GitHub Actions."},open("android/latest.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android release APK with AndroidX dependencies
        run: |
          set -euo pipefail
          cd android
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify APK
        working-directory: android
        env:
          KEYSTORE: ${{ runner.temp }}/home-master-signing/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -euo pipefail
          apksigner sign --ks "$KEYSTORE" --ks-pass "env:KS_PASS" --key-pass "env:KS_PASS" --ks-key-alias "$KEY_ALIAS" --out HomeMaster.apk app/build/outputs/apk/release/app-release-unsigned.apk
          apksigner verify --verbose HomeMaster.apk
          apksigner verify --print-certs HomeMaster.apk
          sha256sum HomeMaster.apk > HomeMaster.apk.sha256
          cat HomeMaster.apk.sha256

      - name: Publish GitHub Release for the TrueNAS update server
        uses: softprops/action-gh-release@v2
        with:
          tag_name: home-master-${{ steps.meta.outputs.version }}
          name: Home Master ${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: |
            android/HomeMaster.apk
            android/latest.json
            android/HomeMaster.apk.sha256
