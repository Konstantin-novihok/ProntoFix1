name: Build and publish Home Master Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Load persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add repository Actions secrets KEYSTORE_B64 and KS_PASS before building."
            exit 1
          fi
          KEY_ALIAS="${KEY_ALIAS_SECRET:-prontofix}"
          mkdir -p "$RUNNER_TEMP/home-master-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/home-master-signing/release.keystore"
          test -s "$RUNNER_TEMP/home-master-signing/release.keystore"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless aapt apksigner zipalign dalvik-exchange android-sdk-platform-23

      - name: Validate signing keystore
        env:
          KEYSTORE: ${{ runner.temp }}/home-master-signing/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -euo pipefail
          openssl pkcs12 -in "$KEYSTORE" -passin env:KS_PASS -info -noout >/dev/null
          keytool -list -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias are readable."

      - name: Set build version and update manifest
        id: meta
        run: |
          set -euo pipefail
          VERSION="3.1.${GITHUB_RUN_NUMBER}"
          CODE="$((31000 + GITHUB_RUN_NUMBER))"
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]+\"/android:versionName=\"$VERSION\"/" android/AndroidManifest.xml
          export VERSION
          python3 -c 'import json,os; json.dump({"version":os.environ["VERSION"],"name":"Home Master "+os.environ["VERSION"],"notes":"Обновление Home Master, опубликованное через GitHub Actions."},open("android/latest.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and sign APK
        working-directory: android
        env:
          KEYSTORE: ${{ runner.temp }}/home-master-signing/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -euo pipefail
          chmod +x build_apk.sh
          ./build_apk.sh
          apksigner verify --verbose HomeMaster.apk
          apksigner verify --print-certs HomeMaster.apk
          aapt dump badging HomeMaster.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)"
          sha256sum HomeMaster.apk > HomeMaster.apk.sha256
          cat HomeMaster.apk.sha256

      - name: Publish GitHub Release for the TrueNAS update server
        uses: softprops/action-gh-release@v2
        with:
          tag_name: home-master-${{ steps.meta.outputs.version }}
          name: Home Master ${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: |
            android/HomeMaster.apk
            android/latest.json
            android/HomeMaster.apk.sha256
