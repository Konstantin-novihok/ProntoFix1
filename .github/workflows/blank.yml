name: ProntoFix CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install --upgrade pip && pip install -r server/requirements.txt
      - name: Check locale files
        run: python tools/check_locales.py
      - name: Run server tests
        env:
          PYTHONPATH: .
        run: |
          python tools/test_server.py
          python tools/test_server2.py

  android-apk:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign dalvik-exchange android-sdk-platform-23
      - name: Build signed APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_JAR=/usr/lib/android-sdk/platforms/android-23/android.jar
          export KEYSTORE="$RUNNER_TEMP/prontofix-ci.keystore"
          export KS_PASS="$(openssl rand -hex 24)"
          export KEY_ALIAS=prontofix-ci
          ./build_apk.sh
          test -s HomeMaster.apk
          apksigner verify --verbose HomeMaster.apk
          aapt dump badging HomeMaster.apk | grep -E '^(package|sdkVersion|targetSdkVersion|application-label:)'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeMaster-Android-APK
          path: android/HomeMaster.apk
          if-no-files-found: error
          retention-days: 14
