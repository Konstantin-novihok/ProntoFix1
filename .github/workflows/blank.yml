name: ProntoFix CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server and test dependencies
        run: python -m pip install --upgrade pip && pip install -r server/requirements.txt httpx2
      - name: Check locale files
        run: python tools/check_locales.py
      - name: Run server tests
        working-directory: server
        env:
          PYTHONPATH: .
        run: |
          python ../tools/test_server.py
          python ../tools/test_server2.py

  android-apk:
    name: Build and verify Android APK (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android app with Room and WorkManager dependencies
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Gradle APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeMaster-Gradle-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
